<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f9" />
    <meta name="description" content="SkyDy — new collections for women, men and kids." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts: only the weights the site uses (was 18 Poppins styles + Roboto). display=swap keeps text visible while they load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Backend: open the connection early so product data and images arrive sooner. Update if your API URL changes. -->
    <link rel="preconnect" href="http://localhost:4000" crossorigin />

    <style>
      /* Paint the page colour before the JS bundle arrives (no white flash). */
      html { background: #f6f5f9; } body { margin: 0; }
    </style>
    <title>SkyDy</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
